<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد التشطيب (Google Sheets)</title>
    <style>
        /* نفس التصميم الشيك بتاعنا */
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #27ae60;
            --warning: #f39c12; --bg: #f4f7f6; --card-bg: #ffffff;
            --text-main: #2d3436; --text-sub: #636e72;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 40px 0; background: linear-gradient(135deg, var(--primary), #34495e); color: white; border-radius: 0 0 25px 25px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-bottom: 4px solid var(--accent); }
        .stat-card.total { border-color: var(--success); }
        .stat-card h3 { font-size: 0.85rem; color: var(--text-sub); margin: 0; }
        .stat-card p { font-size: 1.4rem; font-weight: bold; margin: 10px 0 0; color: var(--primary); }

        .card { background: var(--card-bg); padding: 20px; border-radius: 15px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.85rem; margin-bottom: 5px; font-weight: 600; }
        .input-group input, .input-group select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        .btn-add { background: var(--success); color: white; width: 100%; margin-top: 15px; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: opacity 0.3s; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: right; font-size: 0.8rem; color: var(--text-sub); padding: 10px; border-bottom: 2px solid #eee; }
        td { padding: 12px 10px; border-bottom: 1px solid #f5f5f5; }
        .item-name { font-weight: 600; }
        .item-details { color: var(--text-sub); font-size: 0.8rem; }
        .amount { font-family: monospace; font-weight: bold; color: var(--primary); }
        
        #loading { display: none; text-align: center; padding: 20px; color: var(--accent); font-weight: bold; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <div class="container">
        <h1>🏠 داشبورد مصاريف التشطيب</h1>
        <p>مربوط بجوجل شيت مباشرة ☁️</p>
    </div>
</header>

<div class="container">
    
    <div id="loading">
        <div class="loader"></div>
        <p>جاري مزامنة البيانات مع جوجل شيت...</p>
    </div>

    <!-- Add Item Form -->
    <div class="card">
        <h3>➕ إضافة بند جديد للمحاسب</h3>
        <form id="expenseForm">
            <div class="grid-form">
                <div class="input-group">
                    <label>الفئة</label>
                    <select id="category" required>
                        <option value="أجهزة وأثاث">أجهزة وأثاث</option>
                        <option value="مواد بناء وخامات">مواد بناء وخامات</option>
                        <option value="مصنعيات وعمالة">مصنعيات وعمالة</option>
                        <option value="مناسبات">مناسبات</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>اسم البند</label>
                    <input type="text" id="itemName" required>
                </div>
                <div class="input-group">
                    <label>المبلغ (ج.م)</label>
                    <input type="number" id="itemAmount" required>
                </div>
                <div class="input-group">
                    <label>التفاصيل</label>
                    <input type="text" id="itemNotes" placeholder="-">
                </div>
            </div>
            <button type="submit" class="btn-add" id="submitBtn">حفظ ورفع لجوجل شيت</button>
        </form>
    </div>

    <!-- Stats Dashboard -->
    <div class="dashboard">
        <div class="stat-card total">
            <h3>الإجمالي الكلي</h3>
            <p id="totalSum">0</p>
        </div>
        <div class="stat-card">
            <h3>أجهزة وأثاث</h3>
            <p id="cat1Sum">0</p>
        </div>
        <div class="stat-card">
            <h3>مواد وخامات</h3>
            <p id="cat2Sum">0</p>
        </div>
        <div class="stat-card">
            <h3>مصنعيات ومناسبات</h3>
            <p id="cat3Sum">0</p>
        </div>
    </div>

    <!-- Tables Container -->
    <div id="tablesContainer"></div>

</div>

<script>
    // ⚠️⚠️⚠️ حط الرابط اللي أخدته من جوجل هنا بين علامتين التنصيص ⚠️⚠️⚠️
    const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbxc9ZdNeJFXSKH6OREc-hubk4bNPUZkiWSxkNMFD6CLguanmRfSEf3lyxWkgPghaqyj/exec";

    let expenses = [];

    // دالة تحميل البيانات من جوجل شيت
    async function loadData() {
        if(GOOGLE_APP_URL === "ضع_الرابط_هنا") {
            alert("لا تنسى وضع رابط الـ Web App الخاص بجوجل في الكود!");
            return;
        }

        document.getElementById('loading').style.display = 'block';
        try {
            let response = await fetch(GOOGLE_APP_URL);
            let data = await response.json();
            expenses = data;
            updateUI();
        } catch (error) {
            console.error("Error loading data:", error);
            alert("حدث خطأ أثناء تحميل البيانات من جوجل.");
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    // دالة تحديث الشاشة والأرقام
    function updateUI() {
        let total = 0, c1 = 0, c2 = 0, c3 = 0;
        const groups = { "أجهزة وأثاث": [], "مواد بناء وخامات": [], "مصنعيات وعمالة": [], "مناسبات": [] };

        expenses.forEach(e => {
            let amt = parseFloat(e.amount) || 0;
            total += amt;
            if(e.category === "أجهزة وأثاث") c1 += amt;
            if(e.category === "مواد بناء وخامات") c2 += amt;
            if(e.category === "مصنعيات وعمالة" || e.category === "مناسبات") c3 += amt;
            
            if(groups[e.category]) groups[e.category].push(e);
        });

        document.getElementById('totalSum').innerText = total.toLocaleString() + " ج.م";
        document.getElementById('cat1Sum').innerText = c1.toLocaleString() + " ج.م";
        document.getElementById('cat2Sum').innerText = c2.toLocaleString() + " ج.م";
        document.getElementById('cat3Sum').innerText = c3.toLocaleString() + " ج.م";

        const container = document.getElementById('tablesContainer');
        container.innerHTML = "";

        for(let cat in groups) {
            if(groups[cat].length === 0) continue;
            let html = `<div class="card"><h3>${cat}</h3><table><thead><tr><th>البند</th><th>التفاصيل</th><th>المبلغ</th></tr></thead><tbody>`;
            groups[cat].forEach(item => {
                html += `<tr><td class="item-name">${item.name}</td><td class="item-details">${item.details}</td><td class="amount">${parseFloat(item.amount).toLocaleString()}</td></tr>`;
            });
            html += `</tbody></table></div>`;
            container.innerHTML += html;
        }
    }

    // دالة الإضافة لجوجل شيت
    document.getElementById('expenseForm').onsubmit = async function(e) {
        e.preventDefault();
        
        let btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "جاري الرفع السحابي ☁️...";

        let newItem = {
            action: "add",
            id: Date.now(),
            category: document.getElementById('category').value,
            name: document.getElementById('itemName').value,
            amount: document.getElementById('itemAmount').value,
            details: document.getElementById('itemNotes').value || "-"
        };

        try {
            await fetch(GOOGLE_APP_URL, {
                method: "POST",
                body: JSON.stringify(newItem)
            });
            
            // اضافته للشاشة فورا عشان السرعة
            expenses.push(newItem);
            updateUI();
            this.reset();
            alert("تم الحفظ في جوجل شيت بنجاح!");
        } catch(err) {
            console.error("Error saving data:", err);
            alert("حدث خطأ أثناء الحفظ، يرجى المحاولة مرة أخرى.");
        } finally {
            btn.disabled = false;
            btn.innerText = "حفظ ورفع لجوجل شيت";
        }
    };

    // تشغيل التحميل أول ما الصفحة تفتح
    window.onload = loadData;

</script>

</body>
</html>
