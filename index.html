<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسابات التشطيب الذكية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .header-bg {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border-radius: 0 0 20px 20px;
            padding: 30px 0;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .stat-card {
            border-radius: 15px;
            border: none;
            border-bottom: 4px solid #0d6efd;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card.total {
            border-bottom-color: #198754;
        }

        .amount-text {
            font-family: monospace;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .table-custom th {
            background-color: #f1f4f8;
            color: #495057;
        }

        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            display: none;
        }
        @media screen and (max-width : 768px) {
            .header-bg h1 {
                font-size: 1.2rem;
            }
            .header-bg button {
                padding: 0.25rem 0.5rem;
                font-size: 0.8rem;
            }
            .amount-text {
                font-size: 0.8rem;
            }
            .item-name {
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>

    <div id="loadingOverlay">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
        <h5 class="mt-3 text-primary" id="loadingText">جاري مزامنة البيانات...</h5>
    </div>

    <header class="header-bg text-center position-relative">
        <div class="container">
            <h1 class="fw-bold">🏠 داشبورد مصاريف التشطيب</h1>
            <button id="adminToggleBtn"
                class="btn btn-warning position-absolute top-50 start-0 translate-middle-y ms-3 shadow-sm fw-bold"
                onclick="toggleAdmin()">
                🔒 إدارة
            </button>
        </div>
    </header>

    <div class="container pb-5">

        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="card stat-card total h-100 text-center p-3">
                    <h6 class="text-muted">الإجمالي الكلي</h6>
                    <h3 class="text-success fw-bold mb-0" id="totalSum">0</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card h-100 text-center p-3">
                    <h6 class="text-muted">أجهزة وأثاث</h6>
                    <h4 class="text-primary fw-bold mb-0" id="cat1Sum">0</h4>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card h-100 text-center p-3" style="border-bottom-color:#fd7e14">
                    <h6 class="text-muted">مواد وخامات</h6>
                    <h4 class="text-warning fw-bold mb-0" id="cat2Sum" style="color:#fd7e14 !important">0</h4>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card h-100 text-center p-3" style="border-bottom-color:#6f42c1">
                    <h6 class="text-muted">مصنعيات ومناسبات</h6>
                    <h4 class="text-purple fw-bold mb-0" id="cat3Sum" style="color:#6f42c1">0</h4>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-4 d-none" id="adminPanel">
            <div class="card-header bg-white border-0 pt-4 pb-0">
                <h5 class="text-primary fw-bold" id="formTitle">➕ إضافة بند جديد</h5>
            </div>
            <div class="card-body">
                <form id="expenseForm">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">الفئة</label>
                            <select id="category" class="form-select" required>
                                <option value="أجهزة وأثاث">أجهزة وأثاث</option>
                                <option value="مواد بناء وخامات">مواد بناء وخامات</option>
                                <option value="مصنعيات وعمالة">مصنعيات وعمالة</option>
                                <option value="مناسبات">مناسبات</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">اسم البند</label>
                            <input type="text" id="itemName" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">المبلغ (ج.م)</label>
                            <input type="number" id="itemAmount" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">التفاصيل / ملاحظات</label>
                            <input type="text" id="itemNotes" class="form-control" placeholder="-">
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-success fw-bold px-4" id="submitBtn">حفظ البيانات</button>
                        <button type="button" class="btn btn-secondary fw-bold px-4 d-none" id="cancelEditBtn"
                            onclick="cancelEdit()">إلغاء التعديل</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="tablesContainer"></div>

    </div>

    <script>
        // ⚠️⚠️⚠️ حط الرابط اللي أخدته من جوجل هنا ⚠️⚠️⚠️
        const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbxO2kSTf-GZLL2oVs6obnkXv31fQtfuRxyLsF_VyGDOjesnvLS2379t_HDzN-toJags/exec";
        let expenses = [];
        let editingId = null;

        // نظام الحماية
        let isAdmin = false;
        let currentPassword = "";

        function showLoading(text = "جاري التحميل...") {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // تسجيل الدخول (Admin)
        function toggleAdmin() {
            if (isAdmin) {
                // تسجيل خروج
                isAdmin = false;
                currentPassword = "";
                document.getElementById('adminToggleBtn').innerHTML = "🔒 إدارة";
                document.getElementById('adminToggleBtn').classList.replace('btn-danger', 'btn-warning');
                document.getElementById('adminPanel').classList.add('d-none');
                updateUI();
                return;
            }

            let p = prompt("أدخل كلمة المرور لإدارة المصاريف (إضافة/تعديل/حذف):");
            if (p) {
                currentPassword = p;
                isAdmin = true;
                document.getElementById('adminToggleBtn').innerHTML = "🔓 خروج";
                document.getElementById('adminToggleBtn').classList.replace('btn-warning', 'btn-danger');
                document.getElementById('adminPanel').classList.remove('d-none');
                updateUI(); // عشان نظهر زراير التعديل في الجداول
            }
        }

        async function loadData() {
            if (GOOGLE_APP_URL === "ضع_الرابط_هنا") { alert("لا تنسى وضع رابط جوجل!"); return; }
            showLoading("جاري سحب البيانات...");
            try {
                let response = await fetch(GOOGLE_APP_URL);
                expenses = await response.json();
                updateUI();
            } catch (error) { alert("حدث خطأ أثناء تحميل البيانات."); }
            finally { hideLoading(); }
        }

        function updateUI() {
            let total = 0, c1 = 0, c2 = 0, c3 = 0;
            const groups = { "أجهزة وأثاث": [], "مواد بناء وخامات": [], "مصنعيات وعمالة": [], "مناسبات": [] };

            expenses.forEach(e => {
                let amt = parseFloat(e.amount) || 0;
                total += amt;
                if (e.category === "أجهزة وأثاث") c1 += amt;
                if (e.category === "مواد بناء وخامات") c2 += amt;
                if (e.category === "مصنعيات وعمالة" || e.category === "مناسبات") c3 += amt;
                if (groups[e.category]) groups[e.category].push(e);
            });

            document.getElementById('totalSum').innerText = total.toLocaleString();
            document.getElementById('cat1Sum').innerText = c1.toLocaleString();
            document.getElementById('cat2Sum').innerText = c2.toLocaleString();
            document.getElementById('cat3Sum').innerText = c3.toLocaleString();

            const container = document.getElementById('tablesContainer');
            container.innerHTML = "";

            for (let cat in groups) {
                if (groups[cat].length === 0) continue;

                let html = `
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white border-0 pt-3">
                        <h5 class="fw-bold text-secondary mb-0">${cat}</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover table-custom mb-0 align-middle">
                                <thead>
                                    <tr>
                                        <th class="ps-3">البند</th>
                                        <th>التفاصيل</th>
                                        <th>المبلغ</th>
                                        ${isAdmin ? '<th class="text-center">إجراء</th>' : ''}
                                    </tr>
                                </thead>
                                <tbody>
                `;

                groups[cat].forEach(item => {
                    html += `
                    <tr>
                        <td class="ps-3 fw-semibold item-name">${item.name}</td>
                        <td class="text-muted small item-name">${item.details}</td>
                        <td class="amount-text text-primary">${parseFloat(item.amount).toLocaleString()}</td>
                        ${isAdmin ? `
                        <td class="text-center text-nowrap">
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="startEdit(${item.id})">✏️</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${item.id})">🗑️</button>
                        </td>` : ''}
                    </tr>`;
                });

                html += `</tbody></table></div></div></div>`;
                container.innerHTML += html;
            }
        }

        document.getElementById('expenseForm').onsubmit = async function (e) {
            e.preventDefault();

            let payload = {
                action: editingId ? "edit" : "add",
                id: editingId ? editingId : Date.now(),
                password: currentPassword, // إرسال الباسوورد للتحقق
                category: document.getElementById('category').value,
                name: document.getElementById('itemName').value,
                amount: document.getElementById('itemAmount').value,
                details: document.getElementById('itemNotes').value || "-"
            };

            showLoading("جاري الحفظ...");

            try {
                let res = await fetch(GOOGLE_APP_URL, { method: "POST", body: JSON.stringify(payload) });
                let result = await res.json();

                if (result.status === "error") {
                    alert(result.message); // الباسوورد غلط
                    hideLoading();
                    return;
                }

                if (editingId) {
                    let index = expenses.findIndex(x => x.id == editingId);
                    expenses[index] = payload;
                    cancelEdit();
                } else {
                    expenses.push(payload);
                }

                updateUI();
                this.reset();
            } catch (err) { alert("حدث خطأ في الاتصال."); }
            finally { hideLoading(); }
        };

        async function deleteItem(id) {
            if (!confirm("متأكد من حذف البند؟")) return;

            showLoading("جاري الحذف...");
            try {
                let res = await fetch(GOOGLE_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "delete", id: id, password: currentPassword })
                });
                let result = await res.json();

                if (result.status === "error") {
                    alert(result.message);
                    hideLoading();
                    return;
                }

                expenses = expenses.filter(x => x.id != id);
                updateUI();
            } catch (err) { alert("حدث خطأ."); }
            finally { hideLoading(); }
        }

        function startEdit(id) {
            let item = expenses.find(x => x.id == id);
            if (!item) return;

            editingId = id;
            document.getElementById('category').value = item.category;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemAmount').value = item.amount;
            document.getElementById('itemNotes').value = item.details !== "-" ? item.details : "";

            document.getElementById('formTitle').innerText = "✏️ تعديل البند";
            document.getElementById('submitBtn').innerText = "تحديث";
            document.getElementById('cancelEditBtn').classList.remove('d-none');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editingId = null;
            document.getElementById('expenseForm').reset();
            document.getElementById('formTitle').innerText = "➕ إضافة بند جديد";
            document.getElementById('submitBtn').innerText = "حفظ البيانات";
            document.getElementById('cancelEditBtn').classList.add('d-none');
        }

        window.onload = loadData;
    </script>
</body>

</html>
